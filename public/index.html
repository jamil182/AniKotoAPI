<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AniJs — Watch Anime</title>
  <meta name="description" content="AniJs — browse and discover anime, powered by the AniKoto API." />
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <!-- Nav (shared, mounted from api.js) -->
  <header id="nav"></header>

  <!-- Hero -->
  <section class="hero" id="hero" aria-label="Featured anime">
    <div class="wrap wrap-home hero-content">
      <div class="hero-inner" id="heroInner"></div>
      <div class="hero-dots" id="heroDots"></div>
    </div>
  </section>

  <!-- Main -->
  <div class="wrap wrap-home main">
    <div>
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Latest Episodes</h2>
          <div class="tabs" id="latestTabs">
            <button class="tab on" data-src="latest">All</button>
            <button class="tab" data-src="trending">Trending</button>
          </div>
          <div class="pager" id="latestPager" hidden>
            <button class="pager-btn" id="pagePrev" aria-label="Previous page">&lsaquo;</button>
            <span class="pager-now" id="pageNow">1 / 1</span>
            <button class="pager-btn" id="pageNext" aria-label="Next page">&rsaquo;</button>
          </div>
        </div>
        <div id="latest"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Most Popular</h2>
        </div>
        <div id="popular"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Genres</h2>
          <button class="tab" id="clearFilter" hidden>Clear filter</button>
        </div>
        <div class="chip-row" id="genres"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">A-Z List</h2>
        </div>
        <div class="chip-row az" id="azList"></div>
      </section>
    </div>

    <aside>
      <div class="rail">
        <div class="section-head">
          <h2 class="section-title">Top Anime</h2>
          <div class="tabs" id="topTabs">
            <button class="tab on" data-k="today">Day</button>
            <button class="tab" data-k="week">Week</button>
            <button class="tab" data-k="month">Month</button>
          </div>
        </div>
        <div id="topten"></div>
      </div>
    </aside>
  </div>

  <footer class="foot">
    <div class="wrap foot-inner">
      <span>AniJs — a frontend for the <a href="/docs">AniKoto API</a>.</span>
      <a class="sp" href="/docs">API Docs</a>
      <a href="https://github.com/Shineii86/AniKotoAPI" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <script src="/assets/api.js"></script>
  <script>
    mountNav();

    // ---- Hero carousel (spotlights) ----
    let heroSlides = [], heroIdx = 0, heroTimer = null;

    function renderHero(items) {
      heroSlides = items.slice(0, 6);
      // backdrop layers
      document.querySelectorAll('.hero-slide').forEach(s => s.remove());
      const hero = document.getElementById('hero');
      heroSlides.forEach((it, i) => {
        const div = document.createElement('div');
        div.className = 'hero-slide' + (i === 0 ? ' active' : '');
        div.style.backgroundImage = `url("${it.poster}")`;
        hero.prepend(div);
      });
      const dots = document.getElementById('heroDots');
      dots.innerHTML = heroSlides.map((_, i) => `<button class="${i === 0 ? 'on' : ''}" aria-label="Slide ${i + 1}"></button>`).join('');
      [...dots.children].forEach((b, i) => b.onclick = () => showHero(i));
      showHero(0);
      clearInterval(heroTimer);
      heroTimer = setInterval(() => showHero((heroIdx + 1) % heroSlides.length), 6000);
    }

    function showHero(i) {
      heroIdx = i;
      const it = heroSlides[i];
      if (!it) return;
      document.querySelectorAll('.hero-slide').forEach((s, si) => s.classList.toggle('active', si === i));
      [...document.getElementById('heroDots').children].forEach((b, bi) => b.classList.toggle('on', bi === i));
      const badges = [];
      if (it.quality) badges.push(`<span class="badge q">${esc(it.quality)}</span>`);
      if (it.rating) badges.push(`<span class="badge">${esc(it.rating)}</span>`);
      if (it.sub) badges.push(`<span class="badge sub">SUB ${it.sub}</span>`);
      if (it.dub) badges.push(`<span class="badge dub">DUB ${it.dub}</span>`);
      if (it.date) badges.push(`<span class="badge">${esc(it.date)}</span>`);
      document.getElementById('heroInner').innerHTML = `
        <div class="hero-badges">${badges.join('')}</div>
        <h1>${esc(it.title || it.name)}</h1>
        ${(it.description || it.synopsis) ? `<p>${esc(it.description || it.synopsis)}</p>` : ''}
        <a class="btn primary" href="${animeHref(it.id)}">▶ Details</a>`;
    }

    function heroError() {
      document.getElementById('heroInner').innerHTML =
        `<div class="state" style="text-align:left;padding:0">Couldn't load featured anime.<br><button>Retry</button></div>`;
      document.querySelector('#heroInner button').onclick = boot;
    }

    // ---- Top-ten sidebar ----
    let topData = null;
    function renderTop(list) {
      const el = document.getElementById('topten');
      if (!list || !list.length) { el.innerHTML = '<div class="state">No ranking.</div>'; return; }
      el.innerHTML = list.slice(0, 10).map((it, i) => `
        <div class="rank-row" data-id="${esc(it.id)}">
          <div class="rank-n">${it.rank ?? (i + 1)}</div>
          <img loading="lazy" src="${esc(it.poster)}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="rank-t">${esc(it.name || it.title)}</div>
            <div class="rank-m">${subDubChips(it) || esc(it.type || '')}</div>
          </div>
        </div>`).join('');
    }

    // ---- Genre and A-Z filters -------------------------------------------
    // Both narrow the Latest grid rather than linking away: there is no /search
    // page, and every title here already lives in the local library.
    const filter = { genre: null, letter: null };
    const firstLetter = (t) => {
      const c = String(t || '').trim().charAt(0).toUpperCase();
      return /[A-Z]/.test(c) ? c : '#';
    };
    const applyFilter = (list) => (list || []).filter(a =>
      (!filter.genre || (a.genres || []).includes(filter.genre)) &&
      (!filter.letter || firstLetter(a.title) === filter.letter));

    function paintChips() {
      document.querySelectorAll('#genres .chip').forEach(c =>
        c.classList.toggle('on', c.dataset.genre === filter.genre));
      document.querySelectorAll('#azList .chip').forEach(c =>
        c.classList.toggle('on', c.dataset.letter === filter.letter));
      document.getElementById('clearFilter').hidden = !filter.genre && !filter.letter;
    }

    // ---- Paging -----------------------------------------------------------
    // Pages the list that is actually on screen: the active tab narrowed by the
    // genre and letter filters. Anything else and choosing a filter while on
    // page 2 would leave the grid empty.
    const PAGE_SIZE = 12;
    let activeSrc = 'latest';
    let page = 1;

    const sourceList = () =>
      applyFilter(activeSrc === 'trending' ? (homeCache?.top || []) : (homeCache?.latest || []));
    const pageCount = () => Math.max(1, Math.ceil(sourceList().length / PAGE_SIZE));

    function renderPager() {
      const total = pageCount();
      document.getElementById('latestPager').hidden = total <= 1;
      document.getElementById('pagePrev').disabled = page <= 1;
      document.getElementById('pageNext').disabled = page >= total;
      document.getElementById('pageNow').textContent = page + ' / ' + total;
    }

    function refreshLatest() {
      // A filter can shrink the list under the current page.
      const total = pageCount();
      if (page > total) page = total;
      paintChips();
      renderPager();
      renderCards(document.getElementById('latest'),
        () => Promise.resolve(sourceList().slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE)),
        { count: PAGE_SIZE, empty: 'Nothing matches that filter.' });
    }

    // Any change of source or filter starts again from the first page.
    const resetAndRefresh = () => { page = 1; refreshLatest(); };

    document.getElementById('pagePrev').onclick = () => { if (page > 1) { page--; refreshLatest(); } };
    document.getElementById('pageNext').onclick = () => { if (page < pageCount()) { page++; refreshLatest(); } };

    function renderGenres(list) {
      const el = document.getElementById('genres');
      const g = (list || []).filter(Boolean);
      if (!g.length) { el.innerHTML = '<div class="state">No genres in the library yet.</div>'; return; }
      el.innerHTML = g.map(n => `<button class="chip" data-genre="${esc(n)}">${esc(n)}</button>`).join('');
      el.onclick = (e) => {
        const c = e.target.closest('.chip'); if (!c) return;
        filter.genre = filter.genre === c.dataset.genre ? null : c.dataset.genre;
        resetAndRefresh();
      };
    }

    function renderAz(list) {
      const el = document.getElementById('azList');
      // Only letters the library actually has, so no dead buttons.
      const have = new Set((list || []).map(a => firstLetter(a.title)));
      const letters = [...have].sort();
      if (!letters.length) { el.innerHTML = '<div class="state">Library is empty.</div>'; return; }
      el.innerHTML = letters.map(l => `<button class="chip" data-letter="${esc(l)}">${esc(l)}</button>`).join('');
      el.onclick = (e) => {
        const c = e.target.closest('.chip'); if (!c) return;
        filter.letter = filter.letter === c.dataset.letter ? null : c.dataset.letter;
        resetAndRefresh();
      };
    }

    document.getElementById('clearFilter').onclick = () => {
      filter.genre = null; filter.letter = null; resetAndRefresh();
    };

    // ---- Loaders (from the stored library) ----
    let homeCache = null;
    // Latest and Trending now go through sourceList(), which applies the tab,
    // the filters and the page together; only Most Popular still loads flat.
    const loaders = {
      popular: () => Promise.resolve(homeCache?.top || []),
    };

    async function boot() {
      document.getElementById('heroInner').innerHTML = '<div class="skeleton" style="height:120px;width:60%"></div>';
      try {
        homeCache = await apiGet('/library/home');
      } catch { return heroError(); }

      renderHero(homeCache.spotlights || []);
      refreshLatest();
      renderCards(document.getElementById('popular'), loaders.popular, { count: 12, empty: 'Nothing here yet.' });

      // Top-ten rail (library top, shown under every tab)
      topData = { today: homeCache.top, week: homeCache.top, month: homeCache.top };
      renderTop(homeCache.top);
      renderGenres(homeCache.genres || []);
      renderAz(homeCache.latest || []);
    }

    // ---- Tabs ----
    document.getElementById('latestTabs').onclick = (e) => {
      const b = e.target.closest('.tab'); if (!b) return;
      document.querySelectorAll('#latestTabs .tab').forEach(t => t.classList.toggle('on', t === b));
      activeSrc = b.dataset.src;
      resetAndRefresh();
    };
    document.getElementById('topTabs').onclick = (e) => {
      const b = e.target.closest('.tab'); if (!b || !topData) return;
      document.querySelectorAll('#topTabs .tab').forEach(t => t.classList.toggle('on', t === b));
      renderTop(topData[b.dataset.k]);
    };

    boot();
  </script>
</body>
</html>

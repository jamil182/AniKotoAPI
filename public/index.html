<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AniJs — Watch Anime</title>
  <meta name="description" content="AniJs — browse and discover anime, powered by the AniKoto API." />
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <!-- Nav -->
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="/" class="logo">Ani<b>Js</b></a>
      <div class="nav-search">
        <input id="search" type="text" placeholder="Search anime…" autocomplete="off" />
        <div class="search-drop" id="searchDrop"></div>
      </div>
      <nav class="nav-links">
        <button class="nav-btn" id="randomBtn">Random</button>
        <a class="nav-btn" href="/docs">API Docs</a>
        <a class="nav-btn solid" href="https://github.com/Shineii86/AniKotoAPI" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="hero" aria-label="Featured anime">
    <div class="wrap hero-content">
      <div class="hero-inner" id="heroInner"></div>
      <div class="hero-dots" id="heroDots"></div>
    </div>
  </section>

  <!-- Main -->
  <div class="wrap main">
    <div>
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Latest Episodes</h2>
          <div class="tabs" id="latestTabs">
            <button class="tab on" data-src="latest">All</button>
            <button class="tab" data-src="trending">Trending</button>
          </div>
        </div>
        <div id="latest"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Most Popular</h2>
        </div>
        <div id="popular"></div>
      </section>
    </div>

    <aside>
      <div class="rail">
        <div class="section-head">
          <h2 class="section-title">Top Anime</h2>
          <div class="tabs" id="topTabs">
            <button class="tab on" data-k="today">Day</button>
            <button class="tab" data-k="week">Week</button>
            <button class="tab" data-k="month">Month</button>
          </div>
        </div>
        <div id="topten"></div>
      </div>
    </aside>
  </div>

  <footer class="foot">
    <div class="wrap foot-inner">
      <span>AniJs — a frontend for the <a href="/docs">AniKoto API</a>.</span>
      <a class="sp" href="/docs">API Docs</a>
      <a href="https://github.com/Shineii86/AniKotoAPI" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <script src="/assets/api.js"></script>
  <script>
    // ---- Hero carousel (spotlights) ----
    let heroSlides = [], heroIdx = 0, heroTimer = null;

    function renderHero(items) {
      heroSlides = items.slice(0, 6);
      // backdrop layers
      document.querySelectorAll('.hero-slide').forEach(s => s.remove());
      const hero = document.getElementById('hero');
      heroSlides.forEach((it, i) => {
        const div = document.createElement('div');
        div.className = 'hero-slide' + (i === 0 ? ' active' : '');
        div.style.backgroundImage = `url("${it.poster}")`;
        hero.prepend(div);
      });
      const dots = document.getElementById('heroDots');
      dots.innerHTML = heroSlides.map((_, i) => `<button class="${i === 0 ? 'on' : ''}" aria-label="Slide ${i + 1}"></button>`).join('');
      [...dots.children].forEach((b, i) => b.onclick = () => showHero(i));
      showHero(0);
      clearInterval(heroTimer);
      heroTimer = setInterval(() => showHero((heroIdx + 1) % heroSlides.length), 6000);
    }

    function showHero(i) {
      heroIdx = i;
      const it = heroSlides[i];
      if (!it) return;
      document.querySelectorAll('.hero-slide').forEach((s, si) => s.classList.toggle('active', si === i));
      [...document.getElementById('heroDots').children].forEach((b, bi) => b.classList.toggle('on', bi === i));
      const badges = [];
      if (it.quality) badges.push(`<span class="badge q">${esc(it.quality)}</span>`);
      if (it.rating) badges.push(`<span class="badge">${esc(it.rating)}</span>`);
      if (it.sub) badges.push(`<span class="badge sub">SUB ${it.sub}</span>`);
      if (it.dub) badges.push(`<span class="badge dub">DUB ${it.dub}</span>`);
      if (it.date) badges.push(`<span class="badge">${esc(it.date)}</span>`);
      document.getElementById('heroInner').innerHTML = `
        <div class="hero-badges">${badges.join('')}</div>
        <h1>${esc(it.title || it.name)}</h1>
        ${it.description ? `<p>${esc(it.description)}</p>` : ''}
        <button class="btn primary" disabled title="Coming in a later phase">▶ Play</button>`;
    }

    function heroError() {
      document.getElementById('heroInner').innerHTML =
        `<div class="state" style="text-align:left;padding:0">Couldn't load featured anime.<br><button>Retry</button></div>`;
      document.querySelector('#heroInner button').onclick = boot;
    }

    // ---- Top-ten sidebar ----
    let topData = null;
    function renderTop(list) {
      const el = document.getElementById('topten');
      if (!list || !list.length) { el.innerHTML = '<div class="state">No ranking.</div>'; return; }
      el.innerHTML = list.slice(0, 10).map(it => `
        <div class="rank-row" data-slug="${esc(animeSlug(it.slug))}">
          <div class="rank-n">${it.rank ?? ''}</div>
          <img loading="lazy" src="${esc(it.poster)}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="rank-t">${esc(it.name || it.title)}</div>
            <div class="rank-m">${subDubChips(it) || esc(it.type || '')}</div>
          </div>
        </div>`).join('');
    }

    // ---- Loaders ----
    const loaders = {
      latest: () => apiGet('/latest-updated').then(r => r.data || r),
      trending: () => apiGet('/').then(r => r.trending),
      popular: () => apiGet('/most-popular').then(r => r.data || r),
    };

    async function boot() {
      // Hero + trending come from one /api/ call; fetch it once and share.
      document.getElementById('heroInner').innerHTML = '<div class="skeleton" style="height:120px;width:60%"></div>';
      apiGet('/').then(home => {
        renderHero(home.spotlights || []);
      }).catch(heroError);

      renderCards(document.getElementById('latest'), loaders.latest, { count: 12, empty: 'No recent episodes.' });
      renderCards(document.getElementById('popular'), loaders.popular, { count: 12, empty: 'Nothing popular right now.' });

      // Top-ten (tabbed)
      const topEl = document.getElementById('topten');
      topEl.innerHTML = Array.from({ length: 5 }, () => '<div class="skeleton" style="height:64px;margin:12px 0"></div>').join('');
      apiGet('/top-ten').then(d => { topData = d; renderTop(d.today); })
        .catch(e => { topEl.innerHTML = `<div class="state">Couldn't load ranking.<br><button>Retry</button></div>`; topEl.querySelector('button').onclick = boot; });
    }

    // ---- Tabs ----
    document.getElementById('latestTabs').onclick = (e) => {
      const b = e.target.closest('.tab'); if (!b) return;
      document.querySelectorAll('#latestTabs .tab').forEach(t => t.classList.toggle('on', t === b));
      renderCards(document.getElementById('latest'), loaders[b.dataset.src], { count: 12 });
    };
    document.getElementById('topTabs').onclick = (e) => {
      const b = e.target.closest('.tab'); if (!b || !topData) return;
      document.querySelectorAll('#topTabs .tab').forEach(t => t.classList.toggle('on', t === b));
      renderTop(topData[b.dataset.k]);
    };

    // ---- Search (live dropdown) ----
    const searchInput = document.getElementById('search');
    const searchDrop = document.getElementById('searchDrop');
    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = searchInput.value.trim();
      if (q.length < 2) { searchDrop.classList.remove('open'); return; }
      searchTimer = setTimeout(async () => {
        try {
          const r = await apiGet('/search?keyword=' + encodeURIComponent(q));
          const items = (r.data || []).slice(0, 6);
          searchDrop.innerHTML = items.length
            ? items.map(it => `
                <div class="search-row" data-slug="${esc(animeSlug(it.slug))}">
                  <img loading="lazy" src="${esc(it.poster)}" alt="" onerror="this.style.visibility='hidden'">
                  <div>
                    <div class="t">${esc(it.title)}</div>
                    <div class="m">${esc(it.type || 'Anime')}${it.rating ? ' · ★ ' + esc(it.rating) : ''}</div>
                  </div>
                </div>`).join('')
            : '<div class="search-empty">No matches.</div>';
          searchDrop.classList.add('open');
        } catch (e) {
          searchDrop.innerHTML = `<div class="search-empty">Search failed: ${esc(e.message)}</div>`;
          searchDrop.classList.add('open');
        }
      }, 280);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-search')) searchDrop.classList.remove('open');
    });

    // ---- Random ----
    document.getElementById('randomBtn').onclick = async (e) => {
      const btn = e.target; const old = btn.textContent; btn.textContent = '…'; btn.disabled = true;
      try {
        const r = await apiGet('/random');
        // Detail route lands in a later phase; for now surface the pick in search.
        searchInput.value = r.title || '';
        searchInput.dispatchEvent(new Event('input'));
      } catch (_) { /* ignore */ }
      finally { btn.textContent = old; btn.disabled = false; }
    };

    boot();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>Register — AniJs</title>
  <link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/accounts.css">
  <script type="module" src="/assets/branding.js"></script>
</head>
<body>
  <header id="nav"></header>
  <main class="wrap account-page">
    <section class="account-card" aria-labelledby="accountTitle">
      <p class="account-eyebrow">AKUN ANIJS</p>
      <h1 id="accountTitle">Buat akun baru</h1>
      <p class="account-intro">Daftar dengan email dan kata sandi pilihan Anda.</p>
      <p id="accountError" class="account-error" role="alert" tabindex="-1" hidden></p>
      <form id="accountForm" class="account-form" data-action="register">
        <div class="account-field"><label for="displayName">Nama</label><input id="displayName" name="displayName" autocomplete="nickname" minlength="2" maxlength="60" required></div>
        <div class="account-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required></div>
        <div class="account-field"><label for="password">Kata sandi</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" aria-describedby="passwordHelp" required><small id="passwordHelp">Gunakan 15–128 karakter. Frasa panjang diperbolehkan.</small></div>
        <div class="account-field"><label for="confirmPassword">Konfirmasi kata sandi</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="15" maxlength="128" required></div>
        <button class="nav-btn solid account-submit" type="submit">Register</button>
      </form>
      <p class="account-alternate">Sudah punya akun? <a id="accountAlternate" href="/login">Login</a></p>
      <a class="account-home" href="/home">← Kembali ke beranda</a>
    </section>
  </main>
  <script src="/assets/api.js"></script><script type="module" src="/assets/account-form.js"></script>
</body>
</html>

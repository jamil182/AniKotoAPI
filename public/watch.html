<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aniJr — Watch</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header id="nav"></header>

  <div class="wrap">
    <div class="watch2">
      <div>
        <div class="player-wrap paused" id="playerWrap">
          <video id="video" playsinline></video>
          <div class="v-center">
            <div class="v-spinner"></div>
            <button class="big-play" id="bigPlay" aria-label="Play">▶</button>
          </div>
          <button class="skip-intro" id="skipIntro">Skip Intro ›</button>
          <div class="v-controls" id="vControls">
            <div class="v-seek" id="vSeek">
              <div class="v-seek-track">
                <div class="v-buffered" id="vBuffered"></div>
                <div class="v-progress" id="vProgress"></div>
                <div class="v-thumb" id="vThumb"></div>
              </div>
            </div>
            <div class="v-bar">
              <button class="v-btn" id="vPlay" aria-label="Play/Pause"></button>
              <div class="v-vol-wrap">
                <button class="v-btn" id="vMute" aria-label="Mute"></button>
                <input class="v-vol" id="vVol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
              </div>
              <span class="v-time" id="vTime">00:00 / 00:00</span>
              <span class="v-spacer"></span>
              <button class="v-btn" id="vBack10" aria-label="Back 10s"></button>
              <button class="v-btn" id="vFwd10" aria-label="Forward 10s"></button>
              <button class="v-btn" id="vCC" aria-label="Captions"><span class="v-tooltip">Closed Captions</span></button>
              <button class="v-btn" id="vSettings" aria-label="Settings"><span class="v-tooltip">Settings</span></button>
              <button class="v-btn" id="vPip" aria-label="Picture in picture"><span class="v-tooltip">Miniplayer</span></button>
              <button class="v-btn" id="vFull" aria-label="Fullscreen"><span class="v-tooltip">Fullscreen</span></button>
            </div>
          </div>
          <div class="v-menu" id="vMenu"></div>
          <div class="player-msg" id="playerMsg"><div class="box">Loading…</div></div>
        </div>
        <div class="player-toolbar" id="toolbar">
          <button class="tbtn" id="tbPrev" title="Previous episode">‹ Prev</button>
          <button class="tbtn" id="tbNext" title="Next episode">Next ›</button>
          <button class="tbtn" id="tbAutoPlay"><span class="dot"></span>Auto Play</button>
          <button class="tbtn" id="tbAutoNext"><span class="dot"></span>Auto Next</button>
          <button class="tbtn" id="tbAutoSkip"><span class="dot"></span>Auto Skip</button>
          <button class="tbtn spacer" id="tbLight"><span class="dot"></span>Light</button>
        </div>

        <div id="countdown"></div>

        <div class="watch-row">
          <div class="now-watching" id="nowWatching">Loading…</div>
          <div class="servers-inner" id="servers"></div>
        </div>

        <div class="ep-block">
          <div class="ep-block-head">
            <h3>Episodes</h3>
            <select class="ep-range" id="epRange"></select>
          </div>
          <div class="ep-nums" id="epNums"></div>
        </div>

        <div id="infoPanel"></div>
      </div>

      <aside>
        <div class="related" id="related"><h3>Related</h3><div class="state">—</div></div>
      </aside>
    </div>
  </div>

  <footer class="foot">
    <div class="wrap foot-inner">
      <span>aniJr — a frontend for the <a href="/docs">AniKoto API</a>.</span>
      <a class="sp" href="/">Home</a>
      <a href="https://github.com/Shineii86/AniKotoAPI" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="/assets/api.js"></script>
  <script>
    mountNav();

    // Path: /watch/<library-id>/<ep>
    const parts = location.pathname.replace(/^\/watch\//, '').split('/');
    const id = decodeURIComponent(parts[0] || '');
    const epNo = decodeURIComponent(parts[1] || '1');

    const video = document.getElementById('video');
    const msg = document.getElementById('playerMsg');
    let hls = null, episodes = [], skipData = null, curIndex = -1;
    let serverBtns = [], serverMap = new Map(), tried = new Set();
    let subtitles = [], ccOn = false;
    // What to do when hls fatally errors — set per render path (server chain
    // fallback for Anikoto scrapes, a plain message for the embed path).
    let onPlaybackFail = () => { showMsg('This server failed — trying another…'); fallbackToNext(); };

    // ---- SVG icons ----
    const ICON = {
      play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
      volHigh: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
      volMute: '<svg viewBox="0 0 24 24"><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v2.2l2.5 2.5c0-.2 0-.5 0-.7zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1c1.4-.3 2.7-1 3.8-1.8L19.7 21 21 19.7 4.3 3zM12 4L9.9 6.1 12 8.2V4z"/></svg>',
      back10: '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M4.2 8.6h15.6v9.6a1.8 1.8 0 0 1-1.8 1.8H6a1.8 1.8 0 0 1-1.8-1.8z"/><path d="M10.6 3.4 4.9 7.1a.6.6 0 0 0 0 1l5.7 3.7a.6.6 0 0 0 .92-.5V3.9a.6.6 0 0 0-.92-.5z"/><text x="12" y="17.6" text-anchor="middle" font-size="7.6" font-weight="700" fill="currentColor" font-family="Inter,sans-serif">10</text></svg>',
      fwd10:  '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M4.2 8.6h15.6v9.6a1.8 1.8 0 0 1-1.8 1.8H6a1.8 1.8 0 0 1-1.8-1.8z"/><path d="M13.4 3.4l5.7 3.7a.6.6 0 0 1 0 1l-5.7 3.7a.6.6 0 0 1-.92-.5V3.9a.6.6 0 0 1 .92-.5z"/><text x="12" y="17.6" text-anchor="middle" font-size="7.6" font-weight="700" fill="currentColor" font-family="Inter,sans-serif">10</text></svg>',
      cc:     '<svg viewBox="0 0 24 24"><rect x="2.6" y="5.4" width="18.8" height="13.2" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/><text x="12" y="15.4" text-anchor="middle" font-size="7.4" font-weight="700" fill="currentColor" font-family="Inter,sans-serif">CC</text></svg>',
      gear:   '<svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6a.5.5 0 0 0 .12-.62l-1.9-3.3a.5.5 0 0 0-.6-.22l-2.4.96a7.3 7.3 0 0 0-1.72-1l-.36-2.54a.5.5 0 0 0-.5-.42h-3.8a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.72 1l-2.4-.96a.5.5 0 0 0-.6.22l-1.9 3.3a.5.5 0 0 0 .12.62L4.6 11a7.8 7.8 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.12.62l1.9 3.3a.5.5 0 0 0 .6.22l2.4-.96a7.3 7.3 0 0 0 1.72 1l.36 2.54a.5.5 0 0 0 .5.42h3.8a.5.5 0 0 0 .5-.42l.36-2.54a7.3 7.3 0 0 0 1.72-1l2.4.96a.5.5 0 0 0 .6-.22l1.9-3.3a.5.5 0 0 0-.12-.62zM12 15.4A3.4 3.4 0 1 1 15.4 12 3.4 3.4 0 0 1 12 15.4z"/></svg>',
      pip:    '<svg viewBox="0 0 24 24"><rect x="2.6" y="4.6" width="18.8" height="14.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="12" y="11.4" width="7.4" height="6" rx="1.2"/></svg>',
      expand: '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M14.5 4h5.5v5.5M20 4l-6.4 6.4M9.5 20H4v-5.5M4 20l6.4-6.4"/></svg>',
      quality:'<svg viewBox="0 0 24 24"><rect x="3.2" y="14" width="3.8" height="6.4" rx="1"/><rect x="10.1" y="9.4" width="3.8" height="11" rx="1"/><rect x="17" y="4.4" width="3.8" height="16" rx="1"/></svg>',
      speed:  '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M2.6 7.6h6M2.6 11.4h4.4M2.6 15.2h4.4"/><circle cx="15" cy="12" r="6.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M15 8.6V12l2.4 1.6"/></svg>',
      close:  '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>',
      back:   '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.5 5.5 8 12l6.5 6.5"/></svg>',
      chevron:'<svg viewBox="0 0 24 24" class="v-chev"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9.5 5.5 16 12l-6.5 6.5"/></svg>',
    };

    const showMsg = (h) => { msg.innerHTML = `<div class="box">${h}</div>`; msg.style.display = 'flex'; };
    const hideMsg = () => { msg.style.display = 'none'; };
    const epUrl = (n) => `/watch/${encodeURIComponent(id)}/${encodeURIComponent(n)}`;

    // ---- Persisted toggles ----
    const prefs = (() => { try { return JSON.parse(localStorage.getItem('anijs_watch') || '{}'); } catch { return {}; } })();
    const savePrefs = () => { try { localStorage.setItem('anijs_watch', JSON.stringify(prefs)); } catch {} };
    const pref = (k, def) => (k in prefs ? prefs[k] : def);

    // ---- HLS playback ----
    function destroyHls() { if (hls) { hls.destroy(); hls = null; } }
    // Move to the next server that hasn't been tried yet. Returns false if none.
    // Selects directly (not via .click()) so it does NOT reset the tried set —
    // only a user's manual pick clears it.
    function fallbackToNext() {
      const next = serverBtns.find(b => !tried.has(serverMap.get(b).link_id));
      if (!next) { showMsg('All servers failed for this episode. Try another episode.'); return false; }
      selectServer(serverMap.get(next), next);
      return true;
    }

    // Start playback for the Auto Play toggle.
    // NOTE: Browsers refuse play() on an unmuted element until the viewer has
    // interacted with the page, rejecting with NotAllowedError. The old code
    // swallowed that rejection, so Auto Play silently did nothing on a fresh
    // page load. Muted playback is always permitted, so fall back to it and
    // give the sound back on the first real gesture.
    function armUnmute() {
      const unmute = () => {
        video.muted = false;
        document.removeEventListener('pointerdown', unmute);
        document.removeEventListener('keydown', unmute);
      };
      document.addEventListener('pointerdown', unmute);
      document.addEventListener('keydown', unmute);
    }

    function startPlayback() {
      if (!pref('autoplay', true)) return;
      video.play().catch(() => {
        video.muted = true;
        video.play().then(armUnmute).catch(() => {});
      });
    }

    function play(masterUrl) {
      const src = '/api/stream/proxy?url=' + encodeURIComponent(masterUrl);
      destroyHls(); hideMsg();
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 30 });
        hls.loadSource(src); hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { buildMenu(); applySubtitle(); startPlayback(); });
        hls.on(Hls.Events.ERROR, (_e, d) => {
          if (d.fatal) { destroyHls(); onPlaybackFail(); }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src; applySubtitle(); startPlayback();
      } else { showMsg('This browser cannot play HLS.'); }
    }

    async function selectServer(server, btn) {
      tried.add(server.link_id);
      document.querySelectorAll('.server-btn').forEach(b => b.classList.toggle('on', b === btn));
      showMsg('Resolving stream…');
      try {
        const r = await apiGet('/stream/resolve?id=' + encodeURIComponent(server.link_id));
        if (!r.url) throw new Error(r.error || 'No stream URL');
        skipData = r.skipData || null;
        subtitles = r.subtitles || [];
        play(r.url);
      } catch (e) {
        // Resolve failed — fall through to the next server automatically.
        if (!fallbackToNext()) {
          showMsg(`Couldn't resolve any server (${esc(e.message)}).`);
        }
      }
    }

    function renderServers(servers) {
      onPlaybackFail = () => { showMsg('This server failed — trying another…'); fallbackToNext(); };
      const box = document.getElementById('servers');
      if (!servers.length) { box.innerHTML = '<div class="state">No servers.</div>'; showMsg('No servers available.'); return; }
      const groups = {};
      servers.forEach(s => { (groups[s.type] = groups[s.type] || []).push(s); });
      box.innerHTML = Object.entries(groups).map(([type, list]) => `
        <div class="servers-group">
          <h4>${esc((type || 'sub').toUpperCase())}</h4>
          <div class="server-btns">
            ${list.map((s, i) => `<button class="server-btn" data-type="${esc(type)}" data-i="${i}">${esc(s.name)}</button>`).join('')}
          </div>
        </div>`).join('');
      serverBtns = [...box.querySelectorAll('.server-btn')];
      serverMap = new Map();
      serverBtns.forEach(btn => {
        const s = groups[btn.dataset.type][+btn.dataset.i];
        serverMap.set(btn, s);
        // A manual pick starts a fresh fallback chain from that server.
        btn.onclick = () => { tried.clear(); selectServer(s, btn); };
      });
      // Auto-start the first server directly (fresh chain; tried already empty).
      if (serverBtns[0]) selectServer(serverMap.get(serverBtns[0]), serverBtns[0]);
    }

    // ---- Language servers: resolve the stored MegaPlay embed per language ----
    // Every episode carries embed URLs as JSON {sub?, dub?} (Anikoto s-2 or
    // MAL/AniList), so playback is one uniform path.
    function renderLangServers(embeds) {
      onPlaybackFail = () => showMsg('This stream failed to play. Try the other language or another episode.');
      const box = document.getElementById('servers');
      const langs = [];
      if (embeds.sub) langs.push(['SUB', embeds.sub]);
      if (embeds.dub) langs.push(['DUB', embeds.dub]);
      if (!langs.length) { box.innerHTML = '<div class="state">No stream stored.</div>'; showMsg('No playable source.'); return; }
      box.innerHTML = `<div class="servers-group"><h4>Language</h4><div class="server-btns">${
        langs.map(([l], i) => `<button class="server-btn${i === 0 ? ' on' : ''}" data-i="${i}">${l} · MegaPlay</button>`).join('')
      }</div></div>`;
      const btns = [...box.querySelectorAll('.server-btn')];
      btns.forEach((btn, i) => btn.onclick = () => { btns.forEach(b => b.classList.toggle('on', b === btn)); selectEmbed(langs[i][1]); });
      selectEmbed(langs[0][1]);
    }
    async function selectEmbed(embedUrl) {
      showMsg('Resolving stream…');
      try {
        const r = await apiGet('/stream/resolve-url?url=' + encodeURIComponent(embedUrl));
        if (!r.url) throw new Error(r.error || 'no stream');
        skipData = r.skipData || null; subtitles = r.subtitles || [];
        play(r.url);
      } catch (e) {
        showMsg(`Couldn't resolve this stream (${esc(e.message)}).`);
      }
    }

    // ---- Episode grid with 100-episode ranges ----
    function renderEpisodeGrid() {
      const range = document.getElementById('epRange');
      const nums = document.getElementById('epNums');
      const total = episodes.length;
      const size = 100;
      const ranges = [];
      for (let s = 0; s < total; s += size) ranges.push([s, Math.min(s + size, total)]);
      // which range holds the current episode?
      curIndex = episodes.findIndex(e => String(e.episode_no) === String(epNo));
      const activeRange = Math.max(0, Math.floor((curIndex < 0 ? 0 : curIndex) / size));

      range.innerHTML = ranges.map(([a, b], i) =>
        `<option value="${i}"${i === activeRange ? ' selected' : ''}>${episodes[a].episode_no}-${episodes[b - 1].episode_no}</option>`).join('');

      const drawRange = (ri) => {
        const [a, b] = ranges[ri];
        nums.innerHTML = episodes.slice(a, b).map(e =>
          `<a class="ep-num${String(e.episode_no) === String(epNo) ? ' on' : ''}" href="${epUrl(e.episode_no)}" title="${e.title ? esc(e.title) : 'Episode ' + esc(e.episode_no)}">${esc(e.episode_no)}</a>`).join('');
      };
      range.onchange = () => drawRange(+range.value);
      drawRange(activeRange);
    }

    function renderRelated(items) {
      const el = document.getElementById('related');
      const list = (items || []).slice(0, 12);
      el.innerHTML = `<h3>Related</h3>` + (list.length
        ? list.map(it => `
            <div class="related-row" data-id="${esc(it.id)}">
              <img loading="lazy" src="${esc(it.poster)}" alt="" onerror="this.style.visibility='hidden'">
              <div><div class="t">${esc(it.title)}</div><div class="m">${esc(it.type || 'Anime')}</div></div>
            </div>`).join('')
        : '<div class="state">No related titles.</div>');
    }

    function renderInfo(w) {
      const jpt = w.japaneseTitle || w.japanese_title;
      const jp = jpt && jpt !== w.title ? jpt : '';
      document.getElementById('infoPanel').innerHTML = `
        <div class="watch-info">
          <img src="${esc(w.poster || '/favicon.svg')}" alt="${esc(w.title)}" onerror="this.style.visibility='hidden'">
          <div>
            <h2>${esc(w.title)}</h2>
            ${jp ? `<div class="alt">${esc(jp)}</div>` : ''}
            <div class="detail-meta" style="margin-bottom:10px">
              ${w.type ? `<span class="badge">${esc(w.type)}</span>` : ''}
              ${w.status ? `<span class="badge">${esc(w.status)}</span>` : ''}
              ${w.rating ? `<span class="badge q">★ ${esc(String(w.rating).replace(/\s+/g,' ').trim())}</span>` : ''}
            </div>
            ${w.synopsis ? `<p class="syn">${esc(w.synopsis)}</p>` : ''}
            <div style="margin-top:10px"><a href="/anime/${encodeURIComponent(id)}" style="color:var(--accent-hi);font-size:.85rem">Full details →</a></div>
          </div>
        </div>`;
    }

    function renderCountdown(ts) {
      const el = document.getElementById('countdown');
      if (!ts) { el.innerHTML = ''; return; }
      const target = Number(ts) * 1000;
      const tick = () => {
        const diff = target - Date.now();
        if (diff <= 0) { el.innerHTML = ''; return; }
        const d = Math.floor(diff / 86400000), h = Math.floor(diff % 86400000 / 3600000),
              m = Math.floor(diff % 3600000 / 60000), s = Math.floor(diff % 60000 / 1000);
        el.innerHTML = `<div class="countdown">🔔 Next episode in <b>${d}d ${h}h ${m}m ${s}s</b></div>`;
        setTimeout(tick, 1000);
      };
      tick();
    }

    // ---- Toolbar ----
    function setToggle(btn, key, def, onChange) {
      let val = pref(key, def);
      const apply = () => { btn.classList.toggle('on', val); if (onChange) onChange(val); };
      btn.onclick = () => { val = !val; prefs[key] = val; savePrefs(); apply(); };
      apply();
    }

    function wireToolbar() {
      const goto = (n) => { location.href = epUrl(n); };
      const prevBtn = document.getElementById('tbPrev'), nextBtn = document.getElementById('tbNext');
      prevBtn.disabled = curIndex <= 0;
      nextBtn.disabled = curIndex < 0 || curIndex >= episodes.length - 1;
      prevBtn.onclick = () => { if (curIndex > 0) goto(episodes[curIndex - 1].episode_no); };
      nextBtn.onclick = () => { if (curIndex >= 0 && curIndex < episodes.length - 1) goto(episodes[curIndex + 1].episode_no); };

      setToggle(document.getElementById('tbAutoPlay'), 'autoplay', true);
      setToggle(document.getElementById('tbAutoNext'), 'autonext', false);
      setToggle(document.getElementById('tbAutoSkip'), 'autoskip', true);
      setToggle(document.getElementById('tbLight'), 'light', false, (on) => document.body.classList.toggle('dimmed', on));

      // Auto Skip: jump past intro/outro when enabled
      video.addEventListener('timeupdate', () => {
        if (!pref('autoskip', true) || !skipData) return;
        const t = video.currentTime;
        for (const seg of [skipData.intro, skipData.outro]) {
          if (Array.isArray(seg) && seg[1] > seg[0] && t >= seg[0] && t < seg[1] - 0.5) { video.currentTime = seg[1]; break; }
        }
      });
      // Auto Next: advance when the episode ends
      video.addEventListener('ended', () => {
        if (pref('autonext', false) && curIndex >= 0 && curIndex < episodes.length - 1) goto(episodes[curIndex + 1].episode_no);
      });
    }

    // ---- Subtitles ----
    // Parse WebVTT text into { start, end, text } cues. Timestamps may use a
    // dot or comma for the fraction; tags are stripped for VTTCue.
    function parseVTT(text) {
      const toSec = (s) => {
        const m = s.trim().match(/(?:(\d+):)?(\d+):(\d+)[.,](\d+)/);
        if (!m) return null;
        return (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / 1000;
      };
      const cues = [];
      for (const block of text.replace(/\r/g, '').split(/\n\n+/)) {
        const lines = block.split('\n').filter(Boolean);
        const tl = lines.find(l => l.includes('-->'));
        if (!tl) continue;
        const [a, b] = tl.split('-->');
        // toSec finds the timestamp anywhere in the string, so pass the halves
        // as-is — splitting on spaces broke on the leading space after "-->".
        const start = toSec(a), end = toSec(b || '');
        if (start == null || end == null || end <= start) continue;
        const txt = lines.slice(lines.indexOf(tl) + 1).join('\n').replace(/<[^>]+>/g, '').trim();
        if (txt) cues.push({ start, end, text: txt });
      }
      return cues;
    }

    let subTrack = null, curSub = -1;

    // Load subtitle track `idx` from the subtitles[] list (-1 = none picked
    // yet → use the default track or the first). A stream can carry several
    // languages; the CC menu lists them all and calls this to switch.
    async function applySubtitle(idx) {
      const ccBtn = document.getElementById('vCC');
      if (subTrack) { try { [...(subTrack.cues || [])].forEach(c => subTrack.removeCue(c)); } catch {} subTrack.mode = 'disabled'; subTrack = null; }
      if (!subtitles.length) { ccBtn.style.display = 'none'; curSub = -1; return; }
      ccBtn.style.display = '';
      if (idx == null) {
        // Honour the track the viewer last picked. subLang was written on every
        // pick but never read back anywhere, so each new episode fell through to
        // the default track -- or, failing that, whatever sat first in the list.
        const saved = prefs.subLang;
        idx = saved ? subtitles.findIndex(s => (s.label || s.language) === saved) : -1;
        if (idx < 0) idx = subtitles.findIndex(s => s.default);
        if (idx < 0) idx = 0;
      }
      curSub = idx;
      const sub = subtitles[idx];
      if (!sub) return;
      try {
        // Fetch + parse ourselves: a dynamically-created <track src> fails to
        // load in this setup, so we add cues via addTextTrack instead.
        const vtt = await (await fetch('/api/stream/sub-proxy?url=' + encodeURIComponent(sub.url || sub.file))).text();
        subTrack = video.addTextTrack('subtitles', sub.label || sub.language || 'Subtitle', 'sub');
        for (const c of parseVTT(vtt)) subTrack.addCue(new VTTCue(c.start, c.end, c.text));
        applyCuePosition();
        subTrack.mode = ccOn ? 'showing' : 'hidden';
      } catch { /* leave off */ }
    }

    // ---- Subtitle appearance ----------------------------------------------
    // Cues are rendered natively by the browser (addTextTrack + VTTCue), so the
    // look is driven by a `video::cue` rule. That rule cannot be reached through
    // element.style, so the settings are written into one injected <style>.
    const SUB_COLORS = {
      white: '255,255,255', yellow: '255,222,0', green: '0,214,92', cyan: '0,214,214',
      blue: '58,124,255', magenta: '232,64,214', red: '240,62,62', black: '0,0,0',
    };
    const SUB_EDGES = {
      none: 'none',
      drop: '0 2px 4px rgba(0,0,0,.95)',
      raised: '1px 1px 0 rgba(0,0,0,.9), 2px 2px 0 rgba(0,0,0,.55)',
      depressed: '-1px -1px 0 rgba(0,0,0,.9), -2px -2px 0 rgba(0,0,0,.55)',
      outline: '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000',
    };
    // Cue placement is a property of the cue, not of ::cue — negative values
    // count lines up from the bottom, so -3 clears the control bar.
    const SUB_LINES = { bottom: -1, above: -3, top: 1 };

    const SUB_OPTS = {
      color:   { label: 'Font Color',       def: 'white',  items: Object.keys(SUB_COLORS).map(k => [k, k[0].toUpperCase() + k.slice(1)]) },
      opacity: { label: 'Font Opacity',     def: '100',    items: [['25','25%'],['50','50%'],['75','75%'],['100','100%']] },
      size:    { label: 'Font Size',        def: '100',    items: [['50','50%'],['75','75%'],['100','100%'],['150','150%'],['200','200%'],['300','300%']] },
      family:  { label: 'Font Family',      def: 'sans',   items: [['sans','Arial'],['serif','Serif'],['mono','Monospace'],['round','Rounded']] },
      edge:    { label: 'Character Edge',   def: 'none',   items: [['none','None'],['drop','Drop shadow'],['raised','Raised'],['depressed','Depressed'],['outline','Outline']] },
      bg:      { label: 'Background Color', def: 'black',  items: Object.keys(SUB_COLORS).map(k => [k, k[0].toUpperCase() + k.slice(1)]).concat([['transparent','Transparent']]) },
      pos:     { label: 'Position',         def: 'above',  items: [['bottom','Bottom'],['above','Above controls'],['top','Top']] },
    };
    const SUB_FAMILIES = {
      sans: 'Arial, Helvetica, sans-serif',
      serif: 'Georgia, "Times New Roman", serif',
      mono: '"Courier New", Consolas, monospace',
      round: '"Trebuchet MS", Verdana, sans-serif',
    };

    const subPref = (k) => prefs['sub_' + k] ?? SUB_OPTS[k].def;
    const subLabel = (k) => (SUB_OPTS[k].items.find(([v]) => v === subPref(k)) || [, subPref(k)])[1];

    function applyCueStyle() {
      let tag = document.getElementById('cueStyle');
      if (!tag) { tag = document.createElement('style'); tag.id = 'cueStyle'; document.head.appendChild(tag); }
      const alpha = (+subPref('opacity')) / 100;
      const bg = subPref('bg');
      tag.textContent = 'video::cue {'
        + ' color: rgba(' + SUB_COLORS[subPref('color')] + ',' + alpha + ');'
        + ' background-color: ' + (bg === 'transparent' ? 'transparent' : 'rgba(' + SUB_COLORS[bg] + ',.6)') + ';'
        + ' font-family: ' + SUB_FAMILIES[subPref('family')] + ';'
        + ' font-size: ' + subPref('size') + '%;'
        + ' text-shadow: ' + SUB_EDGES[subPref('edge')] + ';'
        + ' }';
    }

    function applyCuePosition() {
      if (!subTrack) return;
      const pos = subPref('pos');
      const hidden = document.getElementById('playerWrap').classList.contains('hide-controls');
      // 'Above controls' only needs the extra clearance while the bar is on
      // screen; once it hides there is nothing to clear, so the cue drops back
      // down a line.
      const line = (pos === 'above' && hidden) ? -2 : SUB_LINES[pos];
      for (const c of subTrack.cues || []) { try { c.snapToLines = true; c.line = line; } catch {} }
    }

    // Watching the class keeps every hide/show path -- idle timeout, mouseleave,
    // pause -- in sync without having to patch each one separately.
    new MutationObserver(applyCuePosition).observe(
      document.getElementById('playerWrap'), { attributes: true, attributeFilter: ['class'] });

    applyCueStyle();

    // ---- Volume boost via Web Audio (amplifies beyond the 100% cap) ----
    let audioCtx = null, gainNode = null, boost = 1;
    function ensureGain() {
      if (gainNode) return gainNode;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const srcNode = audioCtx.createMediaElementSource(video);
        gainNode = audioCtx.createGain();
        srcNode.connect(gainNode); gainNode.connect(audioCtx.destination);
      } catch { return null; }
      return gainNode;
    }
    function setBoost(x) {
      boost = x;
      const g = ensureGain();
      if (g) { if (audioCtx.state === 'suspended') audioCtx.resume(); g.gain.value = x; }
    }

    // ---- CC on/off (shared by the bar button and the menu) ----
    function setCC(on) {
      ccOn = on; prefs.cc = on; savePrefs();
      document.getElementById('vCC').classList.toggle('on', on);
      if (on) { if (subTrack) subTrack.mode = 'showing'; else if (subtitles.length) applySubtitle(curSub >= 0 ? curSub : null); }
      else if (subTrack) subTrack.mode = 'hidden';
    }

    // ---- Tabbed settings menu: Captions / Speed / Volume Boost (+ Quality) ----
    // The panel renders one of three views. `menuView` picks: the tab view, the
    // Subtitle Settings list, or the value list for a single setting.
    let menuTab = 'cc', menuView = 'main', subOptKey = null;

    const menuHead = (title) => `
      <div class="v-menu-head">
        <button class="v-mhead-btn" data-back="1" aria-label="Back">${ICON.back}</button>
        <span class="v-mhead-title">${title}</span>
        <button class="v-mhead-btn" data-close="1" aria-label="Close">${ICON.close}</button>
      </div>`;

    function buildMenu() {
      const menu = document.getElementById('vMenu');
      const levels = (hls && hls.levels) || [];

      if (menuView === 'subs') {
        // Every subtitle setting, each showing its current value.
        menu.innerHTML = menuHead('Subtitle Settings') + `<div class="v-menu-panel">` +
          Object.keys(SUB_OPTS).map(k => `
            <button class="v-row" data-subopt="${k}">
              <span class="v-row-label">${SUB_OPTS[k].label}</span>
              <span class="v-row-val">${esc(String(subLabel(k)))}${ICON.chevron}</span>
            </button>`).join('') + `</div>`;

      } else if (menuView === 'subopt' && SUB_OPTS[subOptKey]) {
        // The values available for the setting the viewer drilled into.
        menu.innerHTML = menuHead(SUB_OPTS[subOptKey].label) + `<div class="v-menu-panel">` +
          SUB_OPTS[subOptKey].items.map(([v, lbl]) =>
            `<button data-subval="${v}" class="${subPref(subOptKey) === v ? 'on' : ''}">${esc(lbl)}</button>`
          ).join('') + `</div>`;

      } else {
        const tabs = [
          levels.length > 1 ? ['quality', ICON.quality] : null,
          ['cc', ICON.cc],
          ['speed', ICON.speed],
          ['vol', ICON.volHigh],
        ].filter(Boolean);
        if (!tabs.find(t => t[0] === menuTab)) menuTab = tabs[0][0];

        let panel = '';
        if (menuTab === 'cc') {
          panel = `<button class="v-sub-link" data-subs="1">Settings</button>
            <button data-cc="-1" class="${!ccOn ? 'on' : ''}">Off</button>
            ${subtitles.map((s, i) => `<button data-cc="${i}" class="${ccOn && curSub === i ? 'on' : ''}">${esc(s.label || s.language || 'Track ' + (i + 1))}</button>`).join('')}`;
        } else if (menuTab === 'speed') {
          panel = `<h5>Playback speed</h5>` + [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2].map(s =>
            `<button data-s="${s}" class="${video.playbackRate === s ? 'on' : ''}">${s === 1 ? 'Normal' : s + '×'}</button>`).join('');
        } else if (menuTab === 'vol') {
          const pct = Math.round(boost * 100);
          panel = `<h5>Volume Boost</h5>
            <div style="padding:6px 18px">
              <div style="display:flex;justify-content:space-between;font-size:.82rem;color:#fff;margin-bottom:8px">
                <span>Level</span><b>${boost <= 1 ? 'Off' : '+' + pct + '%'}</b></div>
              <input id="boostSlider" type="range" min="1" max="3" step="0.05" value="${boost}" style="width:100%;accent-color:var(--pl-accent)">
              <div style="display:flex;justify-content:space-between;font-size:.7rem;color:rgba(255,255,255,.6);margin-top:4px"><span>Off</span><span>+150%</span><span>+300%</span></div>
            </div>`;
        } else if (menuTab === 'quality') {
          panel = `<h5>Quality</h5>
            <button data-q="-1" class="${hls.autoLevelEnabled ? 'on' : ''}">Auto</button>` +
            levels.map((l, i) => `<button data-q="${i}" class="${!hls.autoLevelEnabled && hls.currentLevel === i ? 'on' : ''}">${l.height ? l.height + 'p' : (l.bitrate/1000|0)+'k'}</button>`).join('');
        }

        menu.innerHTML = `
          <div class="v-menu-tabs">
            ${tabs.map(([id, lbl]) => `<button class="v-mtab${id === menuTab ? ' on' : ''}" data-tab="${id}">${lbl}</button>`).join('')}
            <button class="v-mtab close" data-close="1" aria-label="Close">${ICON.close}</button>
          </div>
          <div class="v-menu-panel">${panel}</div>`;
      }

      // ---- Handlers. Each closes over its own button, so a click landing on an
      //      inner <svg> still resolves the right dataset. ----
      menu.querySelectorAll('[data-close]').forEach(b => b.onclick = () => menu.classList.remove('open'));
      menu.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
        menuView = (menuView === 'subopt') ? 'subs' : 'main'; buildMenu();
      });
      menu.querySelectorAll('[data-subs]').forEach(b => b.onclick = () => { menuView = 'subs'; buildMenu(); });
      menu.querySelectorAll('[data-subopt]').forEach(b => b.onclick = () => {
        subOptKey = b.dataset.subopt; menuView = 'subopt'; buildMenu();
      });
      menu.querySelectorAll('[data-subval]').forEach(b => b.onclick = () => {
        prefs['sub_' + subOptKey] = b.dataset.subval; savePrefs();
        applyCueStyle(); applyCuePosition();
        menuView = 'subs'; buildMenu();
      });
      menu.querySelectorAll('.v-mtab[data-tab]').forEach(b => b.onclick = () => { menuTab = b.dataset.tab; buildMenu(); });
      menu.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { video.playbackRate = +b.dataset.s; buildMenu(); });
      menu.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const q = +b.dataset.q; hls.currentLevel = q; hls.loadLevel = q; buildMenu(); });
      menu.querySelectorAll('[data-cc]').forEach(b => b.onclick = async () => {
        const i = +b.dataset.cc;
        if (i < 0) { setCC(false); }                       // Off
        else { ccOn = true; prefs.cc = true; prefs.subLang = subtitles[i]?.label || ''; savePrefs();
               document.getElementById('vCC').classList.add('on'); await applySubtitle(i); }
        buildMenu();
      });
      const bs = menu.querySelector('#boostSlider');
      if (bs) bs.oninput = () => { setBoost(+bs.value); prefs.boost = +bs.value; savePrefs(); buildMenu(); };
    }

    // ---- Custom player controls ----
    function setupPlayer() {
      const wrap = document.getElementById('playerWrap');
      const seek = document.getElementById('vSeek'), prog = document.getElementById('vProgress'),
            buf = document.getElementById('vBuffered'), thumb = document.getElementById('vThumb'),
            timeEl = document.getElementById('vTime'), playBtn = document.getElementById('vPlay'),
            muteBtn = document.getElementById('vMute'), vol = document.getElementById('vVol'),
            menu = document.getElementById('vMenu');
      const fmt = (t) => { if (!isFinite(t)) return '00:00'; const h = t/3600|0, m = t%3600/60|0, s = t%60|0;
        return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };
      const setPlayIcons = () => { const p = video.paused; playBtn.innerHTML = p ? ICON.play : ICON.pause; wrap.classList.toggle('paused', p); };
      const setVolIcon = () => { muteBtn.innerHTML = (video.muted || video.volume === 0) ? ICON.volMute : ICON.volHigh; };

      // Static control-bar icons. Prepended rather than assigned so each
      // button keeps the .v-tooltip span that already lives inside it.
      for (const [id, svg] of Object.entries({
        vBack10: ICON.back10, vFwd10: ICON.fwd10, vCC: ICON.cc,
        vSettings: ICON.gear, vPip: ICON.pip, vFull: ICON.expand,
      })) document.getElementById(id).insertAdjacentHTML('afterbegin', svg);

      const toggle = () => { video.paused ? video.play().catch(()=>{}) : video.pause(); };
      playBtn.onclick = toggle;
      document.getElementById('bigPlay').onclick = toggle;
      video.addEventListener('click', toggle);
      video.addEventListener('play', setPlayIcons);
      video.addEventListener('pause', setPlayIcons);
      video.addEventListener('waiting', () => wrap.classList.add('buffering'));
      video.addEventListener('playing', () => wrap.classList.remove('buffering'));
      video.addEventListener('canplay', () => wrap.classList.remove('buffering'));

      video.addEventListener('timeupdate', () => {
        const p = video.currentTime / (video.duration || 1);
        prog.style.width = (p * 100) + '%'; thumb.style.left = (p * 100) + '%';
        timeEl.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
        // Skip Intro visibility
        const intro = skipData && skipData.intro;
        const inIntro = Array.isArray(intro) && intro[1] > intro[0] && video.currentTime >= intro[0] && video.currentTime < intro[1] - 0.5;
        document.getElementById('skipIntro').classList.toggle('show', !!inIntro);
      });
      video.addEventListener('progress', () => {
        if (video.buffered.length) buf.style.width = (video.buffered.end(video.buffered.length-1) / (video.duration||1) * 100) + '%';
      });

      // Seek (click + drag)
      const seekTo = (e) => { const r = seek.getBoundingClientRect(); const x = Math.min(Math.max(0, (e.clientX - r.left) / r.width), 1); video.currentTime = x * (video.duration || 0); };
      let dragging = false;
      seek.addEventListener('mousedown', (e) => { dragging = true; seekTo(e); });
      document.addEventListener('mousemove', (e) => { if (dragging) seekTo(e); });
      document.addEventListener('mouseup', () => { dragging = false; });

      // Volume
      vol.value = pref('volume', 1); video.volume = +vol.value;
      vol.oninput = () => { video.volume = +vol.value; video.muted = video.volume === 0; prefs.volume = +vol.value; savePrefs(); setVolIcon(); };
      muteBtn.onclick = () => { video.muted = !video.muted; setVolIcon(); };
      video.addEventListener('volumechange', setVolIcon);

      // Skip ±10
      document.getElementById('vBack10').onclick = () => video.currentTime = Math.max(0, video.currentTime - 10);
      document.getElementById('vFwd10').onclick = () => video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);

      // Skip Intro
      document.getElementById('skipIntro').onclick = () => { if (skipData && skipData.intro) video.currentTime = skipData.intro[1]; };

      // CC
      const ccBtn = document.getElementById('vCC');
      ccOn = pref('cc', false);
      ccBtn.classList.toggle('on', ccOn);
      ccBtn.onclick = () => { setCC(!ccOn); if (menu.classList.contains('open')) buildMenu(); };
      // Restore persisted volume boost, but only after a real user gesture —
      // creating the audio graph on a suspended context would mute playback.
      if (pref('boost', 1) > 1) {
        const restore = () => { setBoost(pref('boost', 1)); document.removeEventListener('pointerdown', restore); };
        document.addEventListener('pointerdown', restore, { once: true });
      }

      // Settings menu
      document.getElementById('vSettings').onclick = (e) => { e.stopPropagation(); menuView = 'main'; buildMenu(); menu.classList.toggle('open'); };
      // Close only on clicks that started outside the menu.
      // NOTE: every click inside the menu rebuilds it, which detaches the clicked
      // node before this listener runs -- closest() would then walk a detached
      // tree and wrongly report the click as 'outside', closing the menu on the
      // viewer mid-navigation. composedPath() is captured when the event is
      // dispatched, so it still shows where the click actually began.
      document.addEventListener('click', (e) => {
        const startedInside = e.composedPath().some(n => n.id === 'vMenu' || n.id === 'vSettings');
        if (!startedInside) menu.classList.remove('open');
      });

      // PiP
      const pipBtn = document.getElementById('vPip');
      if (!document.pictureInPictureEnabled) pipBtn.style.display = 'none';
      pipBtn.onclick = async () => { try { document.pictureInPictureElement ? await document.exitPictureInPicture() : await video.requestPictureInPicture(); } catch {} };

      // Fullscreen
      document.getElementById('vFull').onclick = () => { if (!document.fullscreenElement) wrap.requestFullscreen?.(); else document.exitFullscreen?.(); };

      // Auto-hide controls
      let hideT = null;
      const show = () => { wrap.classList.remove('hide-controls', 'hide-cursor'); clearTimeout(hideT);
        // Do not idle-hide while the settings menu is open -- reading it without
        // moving the mouse used to make it vanish mid-navigation.
        hideT = setTimeout(() => { if (!video.paused && !menu.classList.contains('open')) { wrap.classList.add('hide-controls', 'hide-cursor'); menu.classList.remove('open'); } }, 2600); };
      wrap.addEventListener('mousemove', show);
      wrap.addEventListener('mouseleave', () => { if (!video.paused) wrap.classList.add('hide-controls'); });
      show();

      // Keyboard
      document.addEventListener('keydown', (e) => {
        if (/input|select|textarea/i.test(e.target.tagName)) return;
        if (e.key === ' ') { e.preventDefault(); toggle(); }
        else if (e.key === 'ArrowLeft') video.currentTime -= 5;
        else if (e.key === 'ArrowRight') video.currentTime += 5;
        else if (e.key.toLowerCase() === 'f') document.getElementById('vFull').click();
        else if (e.key.toLowerCase() === 'm') muteBtn.click();
      });

      setPlayIcons(); setVolIcon();
    }

    async function boot() {
      if (!id) { showMsg('No anime specified.'); return; }
      showMsg('Loading episode…');
      try {
        // The library drives metadata + the episode grid; each episode carries
        // its source (anikoto server_ids, or a MAL/AniList embed_url).
        const [info, rows] = await Promise.all([
          apiGet('/library/anime/' + encodeURIComponent(id)),
          apiGet('/library/episodes/' + encodeURIComponent(id)),
        ]);
        episodes = rows.map(e => ({
          episode_no: e.number, title: e.title,
          server_ids: e.server_ids, embed_url: e.embed_url, source: e.source,
          embeds: (() => { try { return JSON.parse(e.embed_url || '{}'); } catch { return {}; } })(),
        }));
        const ep = episodes.find(e => String(e.episode_no) === String(epNo)) || episodes[0];
        if (!ep) throw new Error('Episode not found');

        document.title = `${info.title} — Ep ${ep.episode_no} — AniJs`;
        document.getElementById('nowWatching').innerHTML =
          `You're watching<br><b>Episode ${esc(ep.episode_no)}</b><br><span style="font-size:.78rem">If a server doesn't work, try another.</span>`;

        renderEpisodeGrid();
        wireToolbar();
        setupPlayer();
        renderInfo(info);
        renderRelated(info.recommended || []);
        renderCountdown(null);

        // Uniform playback: every episode stores embed URLs by language.
        // Legacy episodes (stored before the redesign) may only have server_ids.
        if (ep.embeds.sub || ep.embeds.dub) {
          renderLangServers(ep.embeds);
        } else if (ep.server_ids) {
          const servers = await apiGet('/servers?ids=' + encodeURIComponent(ep.server_ids));
          renderServers(servers);
        } else {
          showMsg('No playable source stored for this episode.');
        }
      } catch (e) {
        showMsg(`Couldn't load this episode (${esc(e.message)}).<br><button id="rb">Retry</button>`);
        document.getElementById('rb').onclick = boot;
      }
    }

    boot();
  </script>
</body>
</html>
